<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Re-render from the notebook</title>
<desc id="desc">An existing blue response plot is redrawn in orange after a notebook edit. figrun loads the saved analysis, runs prerequisites and the selected plot chunk verbatim, skips configured expensive chunks, and verifies the new render. figsync then updates the note in place. Headless rerendering currently supports R notebooks.</desc>
<rect x="0" y="0" width="1200" height="520" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="18" y="18" width="1164" height="484" rx="24" fill="#FCFAF5" stroke="none" stroke-width="1"/>
<text x="52" y="69" fill="#172B35" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">Edit the notebook. Refresh the figure.</text>
<text x="52" y="103" fill="#566A73" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Run the figure code already in your notebook, without reopening the analysis session.</text>
<text x="62" y="153" fill="#566A73" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Previous render</text>
<path d="M78 307.0 L323 307.0" fill="none" stroke="#E8EDEF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M78 265.6666666666667 L323 265.6666666666667" fill="none" stroke="#E8EDEF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M78 224.33333333333331 L323 224.33333333333331" fill="none" stroke="#E8EDEF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M78 183.0 L323 183.0" fill="none" stroke="#E8EDEF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M78.0 286.3 L127.0 269.8 L176.0 247.1 L225.0 226.4 L274.0 214.0 L323.0 207.4 L323 307 L78 307 Z" fill="#E8F0F6" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M78.0 286.3 L127.0 269.8 L176.0 247.1 L225.0 226.4 L274.0 214.0 L323.0 207.4" fill="none" stroke="#467FA8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="78.0" cy="286.3333333333333" r="4.2" fill="#FFFFFF" stroke="#467FA8" stroke-width="2.2"/>
<circle cx="127.0" cy="269.8" r="4.2" fill="#FFFFFF" stroke="#467FA8" stroke-width="2.2"/>
<circle cx="176.0" cy="247.06666666666666" r="4.2" fill="#FFFFFF" stroke="#467FA8" stroke-width="2.2"/>
<circle cx="225.0" cy="226.4" r="4.2" fill="#FFFFFF" stroke="#467FA8" stroke-width="2.2"/>
<circle cx="274.0" cy="214.0" r="4.2" fill="#FFFFFF" stroke="#467FA8" stroke-width="2.2"/>
<circle cx="323.0" cy="207.38666666666666" r="4.2" fill="#FFFFFF" stroke="#467FA8" stroke-width="2.2"/>
<text x="78" y="335" fill="#467FA8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">blue</text>
<path d="M350 238 H404 M395 229 L405 238 L395 247" fill="none" stroke="#127D72" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="436" y="153" fill="#127D72" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">New render</text>
<path d="M450 307.0 L695 307.0" fill="none" stroke="#E8EDEF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M450 265.6666666666667 L695 265.6666666666667" fill="none" stroke="#E8EDEF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M450 224.33333333333331 L695 224.33333333333331" fill="none" stroke="#E8EDEF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M450 183.0 L695 183.0" fill="none" stroke="#E8EDEF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M450.0 286.3 L499.0 269.8 L548.0 247.1 L597.0 226.4 L646.0 214.0 L695.0 207.4 L695 307 L450 307 Z" fill="#FBE9DF" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M450.0 286.3 L499.0 269.8 L548.0 247.1 L597.0 226.4 L646.0 214.0 L695.0 207.4" fill="none" stroke="#D86634" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="450.0" cy="286.3333333333333" r="4.2" fill="#FFFFFF" stroke="#D86634" stroke-width="2.2"/>
