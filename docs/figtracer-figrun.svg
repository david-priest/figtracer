<circle cx="548.0" cy="247.06666666666666" r="4.2" fill="#FFFFFF" stroke="#D86634" stroke-width="2.2"/>
<circle cx="597.0" cy="226.4" r="4.2" fill="#FFFFFF" stroke="#D86634" stroke-width="2.2"/>
