<circle cx="695.0" cy="207.38666666666666" r="4.2" fill="#FFFFFF" stroke="#D86634" stroke-width="2.2"/>
<text x="450" y="335" fill="#D86634" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">orange</text>
<circle cx="661" cy="330" r="10" fill="#E6F3ED" stroke="none" stroke-width="1"/>
<path d="M657 330 l3 3 l6 -7" fill="none" stroke="#127D72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="679" y="335" fill="#127D72" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">verified</text>
<text x="62" y="373" fill="#566A73" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Same data. Edited colour. The note’s figure is replaced in place.</text>
<path d="M774 142 L774 374" fill="none" stroke="#D7DEDD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="808" y="155" fill="#127D72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="650" text-anchor="start">figrun</text>
<circle cx="819" cy="186" r="8" fill="#E6F3ED" stroke="none" stroke-width="1"/>
<path d="M815 186 l3 3 l6 -7" fill="none" stroke="#127D72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="840" y="191" fill="#172B35" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Load the saved analysis</text>
<circle cx="819" cy="222" r="8" fill="#E6F3ED" stroke="none" stroke-width="1"/>
<path d="M815 222 l3 3 l6 -7" fill="none" stroke="#127D72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="840" y="227" fill="#172B35" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Run prerequisite chunks</text>
<circle cx="819" cy="258" r="8" fill="#E6F3ED" stroke="none" stroke-width="1"/>
<path d="M815 258 l3 3 l6 -7" fill="none" stroke="#127D72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="840" y="263" fill="#172B35" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Run the selected plot chunk</text>
<circle cx="819" cy="294" r="8" fill="#E6F3ED" stroke="none" stroke-width="1"/>
<path d="M815 294 l3 3 l6 -7" fill="none" stroke="#127D72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="840" y="299" fill="#172B35" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Verify the new render</text>
<circle cx="819" cy="335" r="8" fill="#EDF0F1" stroke="none" stroke-width="1"/>
<path d="M815 335 L823 335" fill="none" stroke="#566A73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="840" y="340" fill="#566A73" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Skip expensive chunks¹</text>
<rect x="42" y="401" width="1116" height="70" rx="12" fill="#172B35" stroke="none" stroke-width="1"/>
<text x="61" y="429" fill="#A4E3CF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="550" text-anchor="start">figtracer figrun --exp EXP01 response-plot</text>
<text x="61" y="452" fill="#CCDADD" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Re-render this chunk from the R notebook.</text>
<path d="M574 435 H612 M604 427 L614 435 L604 443" fill="none" stroke="#92B4BB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="638" y="429" fill="#A4E3CF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="550" text-anchor="start">figtracer figsync sync --exp EXP01 -y</text>
<text x="638" y="452" fill="#CCDADD" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Refresh the figure embedded in the note.</text>
<text x="52" y="491" fill="#566A73" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start">¹ Expensive calls are configurable. This example reuses a saved analysis. Headless figure execution currently supports R.</text>
</svg>
