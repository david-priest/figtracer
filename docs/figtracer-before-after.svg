<text x="52" y="103" fill="#566A73" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">One figure block in a Markdown note, replaced in place and never duplicated.</text>
