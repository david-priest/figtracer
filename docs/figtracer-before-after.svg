<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Change the analysis, re-run, the note updates</title>
<desc id="desc">A Markdown lab note holds a blue bar chart from the first run of figtracer demo. After three values in analysis.py are edited and the demo is run again, the same note block holds the updated orange chart, replaced in place rather than duplicated. The command strip shows figtracer demo run twice.</desc>
