<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Keep analysis and lab notes in sync</title>
  <desc id="desc">A data-neutral diagram of the figtracer workflow. Analysis in R or Python saves figures and tables with a source record. Sync updates those outputs in a Markdown lab note. The notebook, chunk and git commit remain traceable. A person defines the analysis; a coding agent can render, sync and check it.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #08264c; }
    .muted { fill: #526780; }
    .blue { fill: #0866ff; }
    .line { fill: none; stroke: #08264c; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .soft { fill: none; stroke: #b7c7dc; stroke-width: 3; stroke-linecap: round; }
    .plot { fill: none; stroke: #0866ff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="1200" height="560" rx="20" fill="#f4f7fc"/>
  <text x="48" y="70" font-size="39" font-weight="700">Keep analysis and lab notes in sync.</text>
  <text x="48" y="107" class="muted" font-size="19">Current figures and tables. A traceable source for every saved result.</text>

  <text x="180" y="166" font-size="22" font-weight="650" text-anchor="middle">Analysis</text>
  <text x="600" y="166" font-size="22" font-weight="650" text-anchor="middle">Figures &amp; tables</text>
  <text x="1016" y="166" font-size="22" font-weight="650" text-anchor="middle">Lab note</text>

  <!-- Notebook: code is represented abstractly, with no domain-specific data. -->
  <rect x="82" y="188" width="196" height="168" rx="5" fill="#ffffff" stroke="#08264c" stroke-width="2.5"/>
  <path d="M82 222H278" fill="none" stroke="#d9e2ef" stroke-width="1.5"/>
  <circle cx="99" cy="205" r="3" fill="#0866ff"/>
  <circle cx="111" cy="205" r="3" fill="#b7c7dc"/>
  <circle cx="123" cy="205" r="3" fill="#b7c7dc"/>
  <path d="M111 248h95 M128 268h109 M128 288h76 M111 320h117" class="soft"/>
  <path d="M111 248h27 M128 288h36 M111 320h48" class="plot"/>
  <text x="180" y="389" class="muted" font-size="16" text-anchor="middle">R / Python</text>

  <!-- Save arrow. -->
  <path d="M308 271H411 M402 263l9 8-9 8" class="plot"/>
  <text x="359" y="253" class="muted" font-size="15" text-anchor="middle">save</text>

  <!-- Two plain output sheets: a generic figure and a table. -->
  <rect x="447" y="218" width="145" height="118" rx="4" fill="#ffffff" stroke="#08264c" stroke-width="2.5"/>
  <path d="M467 237v77h106" class="line"/>
  <path d="M480 296L515 280L551 248" class="plot"/>
  <g fill="#0866ff">
    <circle cx="480" cy="296" r="4"/><circle cx="515" cy="280" r="4"/><circle cx="551" cy="248" r="4"/>
  </g>
  <rect x="608" y="218" width="145" height="118" rx="4" fill="#ffffff" stroke="#08264c" stroke-width="2.5"/>
  <rect x="625" y="237" width="111" height="19" fill="#e8f0ff"/>
  <path d="M625 256H736 M625 275H736 M625 294H736 M625 313H736 M663 237V313" fill="none" stroke="#b7c7dc" stroke-width="1.5"/>
  <text x="600" y="389" class="muted" font-size="16" text-anchor="middle">Saved outputs + source record</text>

  <!-- Sync arrow. -->
  <path d="M783 271H878 M869 263l9 8-9 8" class="plot"/>
  <text x="831" y="253" class="muted" font-size="15" text-anchor="middle">sync</text>

  <!-- A Markdown note contains the corresponding figure and table. -->
  <rect x="908" y="188" width="216" height="168" rx="5" fill="#ffffff" stroke="#08264c" stroke-width="2.5"/>
  <path d="M928 210h113 M928 227h166" class="soft"/>
  <path d="M928 210h75" class="line"/>
  <path d="M930 249v52h67" class="line"/>
  <path d="M939 289L960 280L983 259" class="plot"/>
  <g fill="#0866ff"><circle cx="939" cy="289" r="3"/><circle cx="960" cy="280" r="3"/><circle cx="983" cy="259" r="3"/></g>
  <rect x="1016" y="251" width="86" height="50" fill="#ffffff" stroke="#b7c7dc" stroke-width="1.5"/>
  <rect x="1017" y="252" width="84" height="12" fill="#e8f0ff"/>
  <path d="M1016 264H1102 M1016 277H1102 M1016 289H1102 M1048 251V301" fill="none" stroke="#b7c7dc" stroke-width="1.5"/>
  <path d="M928 323h173 M928 338h128" class="soft"/>
  <text x="1016" y="389" class="muted" font-size="16" text-anchor="middle">Markdown / Obsidian</text>

  <path d="M48 423H1152" fill="none" stroke="#d3deed"/>
  <text x="48" y="455" font-size="16" font-weight="600">Trace results back to their source</text>
  <text x="1152" y="455" class="muted" font-size="16" text-anchor="end">Notebook · chunk · git commit</text>

  <rect x="0" y="484" width="1200" height="76" rx="20" fill="#08264c"/>
  <rect x="0" y="484" width="1200" height="20" fill="#08264c"/>
  <text x="48" y="529" font-size="19" font-weight="600" style="fill:#ffffff">You define the analysis.</text>
  <text x="1152" y="529" font-size="18" text-anchor="end" style="fill:#d8e7ff">An agent can render, sync and check.</text>
</svg>
