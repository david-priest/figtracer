<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
<title id="title">Lab notes that keep up</title>
<desc id="desc">A Markdown lab note contains an updated response plot, a table of current group means, and a checked value in its prose. The saved figure and table retain their notebook, chunk and git commit in a manifest. A scientist defines the analysis; a coding agent can run figtracer to render, sync and check the record. The diagram is an illustration, not a software interface.</desc>
