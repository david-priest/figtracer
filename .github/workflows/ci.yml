name: CI

permissions:
  contents: read

# Hosted runs spend the account's shared private-repository allowance, which ran
# out on 2026-10-22 (about 430 of that cycle's 2,962 minutes were this workflow),
# and every change is tested locally before it merges. So:
#   push to main       Python 3.12 and the clean-wheel smoke test
#   pull request       nothing unless requested: add the run-hosted-ci label (remove
#                      and re-add it to run again), or set the repository variable
#                      AUTOMATIC_HOSTED_CI to true to run every non-draft revision
#   workflow_dispatch  the full matrix, Python 3.11 to 3.14, and the smoke test
# A change that touches only Markdown or docs/ runs nothing.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# Superseded revisions must not keep spending the shared Actions allowance.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-hosted-ci') ||
      (github.event.action != 'labeled' && vars.AUTOMATIC_HOSTED_CI == 'true' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["3.11", "3.12", "3.13", "3.14"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest

  package:
    name: Clean wheel smoke
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-hosted-ci') ||
      (github.event.action != 'labeled' && vars.AUTOMATIC_HOSTED_CI == 'true' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Verify source distribution resources
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile

          archive = next(Path("dist").glob("*.tar.gz"))
          with tarfile.open(archive) as source_dist:
              names = source_dist.getnames()
          assert any(name.endswith("/r/figtracer.R") for name in names)
          assert any(name.endswith("/figtracer/resources/figtracer.R") for name in names)
          PY
      - name: Install wheel without development extras
        run: |
          python -m venv /tmp/figtracer-wheel-smoke
          wheel="$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")))')"
          /tmp/figtracer-wheel-smoke/bin/python -m pip install "$wheel"
          /tmp/figtracer-wheel-smoke/bin/python -m pip check
      - name: Exercise installed entry points and resources
        working-directory: /tmp
        run: |
          /tmp/figtracer-wheel-smoke/bin/figtracer --help
          /tmp/figtracer-wheel-smoke/bin/labkit --help
          /tmp/figtracer-wheel-smoke/bin/figtools --help
          /tmp/figtracer-wheel-smoke/bin/python - <<'PY'
          from importlib.resources import files

          from PIL import Image
          import figtools.verify
          from figtracer.resources import r_shim_path, r_shim_resource

          assert Image is not None
          assert files("figtools").joinpath("config/journals.yaml").is_file()
          assert files("labkit").joinpath("config/projects.example.yaml").is_file()
          assert files("labkit").joinpath("templates/wetlab_experiment.md").is_file()
          assert r_shim_resource().is_file()
          with r_shim_path() as path:
              assert path.is_file()
              assert "saveFig <- function" in path.read_text()
          PY
